name: compter
description: compter for iOS and Android, on the Rust core in ../crates.
publish_to: none
version: 0.2.5+2

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Exact: must match `flutter_rust_bridge` in crates/compter-mobile/Cargo.toml
  flutter_rust_bridge: 2.13.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  open_filex: ^5.0.0
  file_picker: ^13.1.0
  # hook/build.dart builds ../crates/compter-mobile with these; Flutter bundles the library
  hooks: ^2.2.0
  native_toolchain_rust: ^1.0.7
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.5
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  shared_preferences: ^2.5.6
  cupertino_icons: ^2.0.0
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
