[workspace]
members = ["crates/compter-core", "crates/compter-mobile", "crates/compter-tui"]
# What a plain `cargo build` / `cargo test` at the root covers. compter-mobile is left out: its
# flutter_rust_bridge dependency compiles C, which the desktop cross-builds (musl, Windows arm64)
# have no compiler for. Build or test it with `-p compter-mobile`.
default-members = ["crates/compter-core", "crates/compter-tui"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
accounting-core = { git = "https://github.com/harisr92/accounting-blue.git", rev = "0700ab4976b3193a69d63b6fe4c8e6d14ec35c23", features = ["pdf"] }
async-trait = "0.1.92"
bigdecimal = { version = "0.4", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
color-eyre = "0.6.5"
compter-core = { path = "crates/compter-core" }
pollster = "1.0.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
redb = { version = "4.4", features = ["uuid"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
tempfile = "3.27.0"
thiserror = "2"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
