[package]
name = "compter-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
accounting-core = { git = "https://github.com/harisr92/accounting-blue.git", rev = "3467ec6114e57ec6fba7b7d9c066382da0d4fa4a", features = ["pdf"] }
bigdecimal = { version = "0.4", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
color-eyre = "0.6.5"
ratatui = { version = "0.30.2", default-features = false, features = ["termion"] }
serde = { version = "1.0.229", features = ["derive"] }
termion = "4"
thiserror = "2"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1.0.154"
