name: Package Windows

# Builds and uploads the archives to the run. release.yml calls this on a v* tag and
# publishes them; run it by hand to build without releasing.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build & Package for Windows
    runs-on: windows-latest

    env:
      # Link the C runtime statically, so the .exe runs without the Visual C++ redistributable
      RUSTFLAGS: -C target-feature=+crt-static
      # Google sign-in for Drive sync (`compter drive sign-in`), compiled in: the Desktop OAuth
      # client of the Cloud project the phone app uses. Repository secrets.
      COMPTER_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.COMPTER_GOOGLE_DESKTOP_CLIENT_ID }}
      COMPTER_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.COMPTER_GOOGLE_DESKTOP_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # A release without them can't sign in to Drive, and the phone syncs only through Drive
      - name: Check the Google sign-in client is set
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ -z "$COMPTER_GOOGLE_DESKTOP_CLIENT_ID" ] || [ -z "$COMPTER_GOOGLE_DESKTOP_CLIENT_SECRET" ]; then
            echo "::error::Set the COMPTER_GOOGLE_DESKTOP_CLIENT_ID and _SECRET repository secrets"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --verbose

      - name: Build for x86_64
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build for ARM64
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Create Archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $builds = @{
            'x86_64' = 'x86_64-pc-windows-msvc'
            'arm64'  = 'aarch64-pc-windows-msvc'
          }
          foreach ($arch in $builds.Keys) {
            $stage = "dist/stage-$arch"
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            Copy-Item "target/$($builds[$arch])/release/compter-tui.exe" $stage
            Compress-Archive -Path "$stage/compter-tui.exe" -DestinationPath "dist/compter-tui-windows-$arch.zip" -Force
            Remove-Item -Recurse $stage
          }

          # Generate SHA256 checksums in shasum's format
          Get-ChildItem dist/*.zip | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS-windows.txt
          Get-Content dist/SHA256SUMS-windows.txt

      - name: Upload Artifacts to Run
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/*.zip
            dist/SHA256SUMS-windows.txt
