name: Package Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish release draft (if running manually)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package for Windows
    runs-on: windows-latest

    env:
      # Link the C runtime statically, so the .exe runs without the Visual C++ redistributable
      RUSTFLAGS: -C target-feature=+crt-static

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --verbose

      - name: Build for x86_64
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build for ARM64
        run: cargo build --release --target aarch64-pc-windows-msvc

      - name: Create Archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $builds = @{
            'x86_64' = 'x86_64-pc-windows-msvc'
            'arm64'  = 'aarch64-pc-windows-msvc'
          }
          foreach ($arch in $builds.Keys) {
            $stage = "dist/stage-$arch"
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            Copy-Item "target/$($builds[$arch])/release/compter-tui.exe" $stage
            Compress-Archive -Path "$stage/compter-tui.exe" -DestinationPath "dist/compter-tui-windows-$arch.zip" -Force
            Remove-Item -Recurse $stage
          }

          # Generate SHA256 checksums in shasum's format
          Get-ChildItem dist/*.zip | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS-windows.txt
          Get-Content dist/SHA256SUMS-windows.txt

      - name: Upload Artifacts to Run
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/*.zip
            dist/SHA256SUMS-windows.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS-windows.txt
          generate_release_notes: true
          draft: false
          prerelease: false
