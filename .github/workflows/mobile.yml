name: Mobile

on:
  push:
    branches: [ "trunk" ]
    paths: [ "app/**", "crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/mobile.yml" ]
  pull_request:
    branches: [ "trunk" ]
    paths: [ "app/**", "crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/mobile.yml" ]

env:
  CARGO_TERM_COLOR: always
  # Exact: the Dart and Rust halves of flutter_rust_bridge must match this version
  FRB_VERSION: "2.13.0"
  FLUTTER_VERSION: "3.47.7"

jobs:
  # The bindings are current, and the screens pass their tests against the real Rust core
  test:
    name: Bindings and widget tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache flutter_rust_bridge_codegen
        id: codegen
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/flutter_rust_bridge_codegen
            ~/.cargo/bin/cargo-expand
          key: frb-${{ runner.os }}-${{ env.FRB_VERSION }}

      - name: Install flutter_rust_bridge_codegen
        if: steps.codegen.outputs.cache-hit != 'true'
        run: |
          cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked
          cargo install cargo-expand --locked

      - name: Get packages
        working-directory: app
        run: flutter pub get

      # The generator has no --check: regenerate, format as the workspace does, and fail on
      # any difference from what is committed
      - name: Check the bindings are current
        working-directory: app
        run: |
          flutter_rust_bridge_codegen generate
          cargo fmt --all
          git diff --exit-code -- ../crates/compter-mobile lib/src/rust

      - name: Build the Rust library for the host
        run: cargo build -p compter-mobile

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Widget tests
        working-directory: app
        run: flutter test

  # cargokit builds the Rust library inside each platform's build
  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build a release APK (debug-signed)
        working-directory: app
        run: flutter build apk --release

  ios:
    name: iOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build for devices, unsigned
        working-directory: app
        run: flutter build ios --release --no-codesign
