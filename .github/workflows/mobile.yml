name: Mobile

on:
  push:
    branches: [ "trunk" ]
    paths: [ "app/**", "crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/mobile.yml" ]
  pull_request:
    branches: [ "trunk" ]
    paths: [ "app/**", "crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/mobile.yml" ]

env:
  CARGO_TERM_COLOR: always
  # Exact: the Dart and Rust halves of flutter_rust_bridge must match this version
  FRB_VERSION: "2.13.0"
  FLUTTER_VERSION: "3.47.7"

jobs:
  # The bindings are current, and the screens pass their tests against the real Rust core
  test:
    name: Bindings and widget tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache flutter_rust_bridge_codegen
        id: codegen
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/flutter_rust_bridge_codegen
            ~/.cargo/bin/cargo-expand
          key: frb-${{ runner.os }}-${{ env.FRB_VERSION }}

      - name: Install flutter_rust_bridge_codegen
        if: steps.codegen.outputs.cache-hit != 'true'
        run: |
          cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked
          cargo install cargo-expand --locked

      - name: Get packages
        working-directory: app
        run: flutter pub get

      # The generator has no --check: regenerate, format as the workspace does, and fail on
      # any difference from what is committed
      - name: Check the bindings are current
        working-directory: app
        run: |
          flutter_rust_bridge_codegen generate
          cargo fmt --all
          git diff --exit-code -- ../crates/compter-mobile lib/src/rust

      - name: Analyze
        working-directory: app
        run: flutter analyze

      # The build hook builds the Rust library for the host first
      - name: Widget tests
        working-directory: app
        run: flutter test

  # app/hook/build.dart builds the Rust library for each target, with the Rust pinned in
  # crates/compter-mobile/rust-toolchain.toml, which rustup installs on first use
  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build a release APK (debug-signed)
        working-directory: app
        run: flutter build apk --release

      # Google Play refuses 64-bit libraries that can't load on 16 KB memory pages
      - name: Check 16 KB page alignment
        working-directory: app
        run: |
          set -o pipefail
          shopt -s failglob
          readelf=$(ls -d "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf | sort -V | tail -1)
          unzip -q -o build/app/outputs/flutter-apk/app-release.apk 'lib/*' -d "$RUNNER_TEMP/apk"
          status=0
          for abi in arm64-v8a x86_64; do
            # A missing library would otherwise pass unchecked
            test -f "$RUNNER_TEMP/apk/lib/$abi/libcompter_mobile.so"
          done
          for so in "$RUNNER_TEMP"/apk/lib/{arm64-v8a,x86_64}/*.so; do
            # Read the headers first: a failure inside the loop's list would not stop the step
            aligns=$("$readelf" -lW "$so" | awk '/LOAD/ { print $NF }')
            test -n "$aligns"
            for align in $aligns; do
              if (( align < 0x4000 )); then
                echo "::error::$so has a LOAD segment aligned to $align, below 16 KB"
                status=1
              fi
            done
          done
          exit $status

  ios:
    name: iOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build for devices, unsigned
        working-directory: app
        run: flutter build ios --release --no-codesign
