name: Package macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish release draft (if running manually)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-macos:
    name: Build & Package for macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --verbose

      - name: Build for Apple Silicon (arm64)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build for Intel (x86_64)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create Universal Binary & Archives
        run: |
          mkdir -p dist/bin

          ARM_BIN="target/aarch64-apple-darwin/release/compter-tui"
          X86_BIN="target/x86_64-apple-darwin/release/compter-tui"
          UNIV_BIN="dist/bin/compter-tui"

          # Create universal binary using lipo
          lipo -create -output "$UNIV_BIN" "$ARM_BIN" "$X86_BIN"
          chmod +x "$UNIV_BIN"

          # Verify the universal binary
          file "$UNIV_BIN"

          # Package Apple Silicon archive
          tar -czf dist/compter-tui-macos-arm64.tar.gz -C target/aarch64-apple-darwin/release compter-tui

          # Package Intel archive
          tar -czf dist/compter-tui-macos-x86_64.tar.gz -C target/x86_64-apple-darwin/release compter-tui

          # Package Universal archive
          tar -czf dist/compter-tui-macos-universal.tar.gz -C dist/bin compter-tui

          # Generate SHA256 checksums
          cd dist
          shasum -a 256 *.tar.gz > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt

      - name: Upload Artifacts to Run
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS-macos.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS-macos.txt
          generate_release_notes: true
          draft: false
          prerelease: false
