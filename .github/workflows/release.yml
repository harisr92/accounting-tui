name: Release

# A tag like v0.3.0 builds every platform, then publishes one GitHub release with all the
# archives and generated notes. The package workflows only build, so the notes are written once.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the release (if running manually)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  linux:
    uses: ./.github/workflows/package-linux.yml
    secrets: inherit

  macos:
    uses: ./.github/workflows/package-macos.yml
    secrets: inherit

  windows:
    uses: ./.github/workflows/package-windows.yml
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS-*.txt
          generate_release_notes: true
          draft: false
          prerelease: false
