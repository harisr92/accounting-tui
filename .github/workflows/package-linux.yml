name: Package Linux

# Builds and uploads the archives to the run. release.yml calls this on a v* tag and
# publishes them; run it by hand to build without releasing.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build & Package for Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    env:
      # Google sign-in for Drive sync (`compter drive sign-in`), compiled in: the Desktop OAuth
      # client of the Cloud project the phone app uses. Repository secrets.
      COMPTER_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.COMPTER_GOOGLE_DESKTOP_CLIENT_ID }}
      COMPTER_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.COMPTER_GOOGLE_DESKTOP_CLIENT_SECRET }}

    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # A release without them can't sign in to Drive, and the phone syncs only through Drive
      - name: Check the Google sign-in client is set
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ -z "$COMPTER_GOOGLE_DESKTOP_CLIENT_ID" ] || [ -z "$COMPTER_GOOGLE_DESKTOP_CLIENT_SECRET" ]; then
            echo "::error::Set the COMPTER_GOOGLE_DESKTOP_CLIENT_ID and _SECRET repository secrets"
            exit 1
          fi

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run tests
        run: cargo test --verbose

      # musl links statically, so the binary runs on any distribution whatever its glibc
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create Archive
        run: |
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/compter-tui"

          # Verify the binary is static
          file "$BIN"

          tar -czf "dist/compter-tui-linux-${{ matrix.arch }}.tar.gz" -C "target/${{ matrix.target }}/release" compter-tui

      - name: Upload Artifacts to Run
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries-${{ matrix.arch }}
          path: dist/*.tar.gz

  # One checksum file for both architectures
  release:
    name: Checksum
    needs: build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: linux-binaries-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - name: Upload Checksums to Run
        uses: actions/upload-artifact@v4
        with:
          name: linux-checksums
          path: dist/SHA256SUMS-linux.txt
